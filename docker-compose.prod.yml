# =============================================================
# CoBuddy Companion Backend — Docker Compose (Production)
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: cobuddy_companion_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cobuddy_companion_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cobuddy_companion_network_prod

  redis:
    image: redis:7-alpine
    container_name: cobuddy_companion_redis_prod
    restart: always
    volumes:
      - cobuddy_companion_redis_data_prod:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cobuddy_companion_network_prod

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobuddy_companion_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      ADMIN_API_URL: ${ADMIN_API_URL:?Set ADMIN_API_URL in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
    ports:
      - "4001:4001"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cobuddy_companion_network_prod

volumes:
  cobuddy_companion_postgres_data_prod:
    driver: local
  cobuddy_companion_redis_data_prod:
    driver: local

networks:
  cobuddy_companion_network_prod:
    driver: bridge
    name: cobuddy_companion_network_prod
