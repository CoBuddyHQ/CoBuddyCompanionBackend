# =============================================================
# CoBuddy Companion Backend — Docker Compose (Development)
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: cobuddy_companion_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cobuddy_companion_db}
      POSTGRES_USER: ${POSTGRES_USER:-cobuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - cobuddy_companion_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobuddy} -d ${POSTGRES_DB:-cobuddy_companion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cobuddy_companion_network_dev

  redis:
    image: redis:7-alpine
    container_name: cobuddy_companion_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cobuddy_companion_redis_data_dev:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cobuddy_companion_network_dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobuddy_companion_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-cobuddy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cobuddy_companion_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      OTP_TEST_BYPASS_ENABLED: ${OTP_TEST_BYPASS_ENABLED:-false}
      OTP_TEST_ALLOWED_PHONES: ${OTP_TEST_ALLOWED_PHONES:-}
      CORS_ORIGIN: "*"
    ports:
      - "4001:4001"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./uploads:/app/uploads
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cobuddy_companion_network_dev

volumes:
  cobuddy_companion_postgres_data_dev:
    driver: local
  cobuddy_companion_redis_data_dev:
    driver: local

networks:
  cobuddy_companion_network_dev:
    driver: bridge
    name: cobuddy_companion_network_dev
