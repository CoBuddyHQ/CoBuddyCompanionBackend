version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobuddy_companion_api
    restart: always
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://cobuddy:cobuddy_secret@postgres:5432/cobuddy_companion?schema=public
      REDIS_URL: redis://redis:6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: cobuddy_postgres
    environment:
      POSTGRES_USER: cobuddy
      POSTGRES_PASSWORD: cobuddy_secret
      POSTGRES_DB: cobuddy_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cobuddy_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
