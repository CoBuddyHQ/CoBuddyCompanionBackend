version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cobuddy_postgres
    environment:
      POSTGRES_USER: cobuddy
      POSTGRES_PASSWORD: cobuddy_secret
      POSTGRES_DB: cobuddy_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cobuddy_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
