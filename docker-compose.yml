# =============================================================
# CoBuddy Companion Backend — Docker Compose (Development)
#
# Usage on any machine:
#   git clone <repo>
#   cd cobuddy-companion-backend
#   docker compose up -d --build
#
# Prisma commands (inside container):
#   docker compose exec backend npx prisma generate
#   docker compose exec backend npx prisma migrate deploy
#   docker compose exec backend npx prisma studio
#
# Version checks (inside container):
#   docker compose exec backend node -v
#   docker compose exec backend npm -v
#   docker compose exec backend npx prisma -v
# =============================================================

services:

  # ─── PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cobuddy_companion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cobuddy_companion_db}
      POSTGRES_USER: ${POSTGRES_USER:-cobuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432" # Host port 5434 avoids collision with Admin postgres 5432
    volumes:
      - cobuddy_companion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobuddy} -d ${POSTGRES_DB:-cobuddy_companion_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cobuddy_companion_network

  # ─── Redis Cache ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cobuddy_companion_redis
    restart: unless-stopped
    ports:
      - "6381:6379" # Host port 6381 avoids collision with Admin redis 6379
    volumes:
      - cobuddy_companion_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cobuddy_companion_network

  # ─── NestJS Backend ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobuddy_companion_backend
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: 4001

      # Points to the postgres SERVICE NAME — works on any laptop automatically
      DATABASE_URL: postgresql://${POSTGRES_USER:-cobuddy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cobuddy_companion_db}?schema=public

      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      OTP_TEST_BYPASS_ENABLED: ${OTP_TEST_BYPASS_ENABLED:-false}
      OTP_TEST_ALLOWED_PHONES: ${OTP_TEST_ALLOWED_PHONES:-}
      ENABLE_REQUEST_SIMULATOR: ${ENABLE_REQUEST_SIMULATOR:-false}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}

      # Cross-backend S2S bridges to Customer and Admin backends
      CUSTOMER_API_URL: ${CUSTOMER_API_URL:-http://host.docker.internal:4002}
      ADMIN_API_URL: ${ADMIN_API_URL:-http://host.docker.internal:4000}

    ports:
      - "4001:4001"

    volumes:
      # Live reload: mount compiled dist and src so changes reflect without full image rebuild
      - ./dist:/app/dist
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      # Persist uploaded files
      - ./uploads:/app/uploads
      # Prevent host node_modules from overwriting container's
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:4001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - cobuddy_companion_network

# ─── Named Volumes ─────────────────────────────────────────
volumes:
  cobuddy_companion_postgres_data:
    driver: local
  cobuddy_companion_redis_data:
    driver: local

# ─── Isolated Network ──────────────────────────────────────
networks:
  cobuddy_companion_network:
    driver: bridge
    name: cobuddy_companion_network
